<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ppnav:injected -->
<script>window.PP_DEPTH=1;
(function(){try{var t=localStorage.getItem('pp-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>Log In · PacketPulse</title>
<link rel="icon" href="../assets/packet-pulse-logo.png">
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/chrome.css">
<link rel="stylesheet" href="../assets/nav.css">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
</head>
<body>
<div class="scr" style="width:498px;display:block">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--color-divider)">
      <img src="../assets/packet-pulse-logo.png" alt="Packet Pulse" style="height:26px;width:auto">
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px" class="mut">New here?</span><a class="btn btn-ghost" style="font-size:12.5px" href="signup.html">Sign up</a></div>
    </div>
    <div style="padding:44px 40px 46px">
      <h1 style="font-size:25px;margin:0 0 8px">Welcome back</h1>
      <p style="margin:0 0 24px;font-size:13px" class="mut">3 people are waiting on your endorsement.</p>

      <div style="display:flex;flex-direction:column;gap:9px;margin-bottom:20px">
        <button class="btn btn-secondary btn-block" style="justify-content:center;font-size:13px;margin-top:0"><i class="ph-fill ph-github-logo" style="font-size:17px"></i>Continue with GitHub</button>
        <button class="btn btn-secondary btn-block" style="justify-content:center;font-size:13px;margin-top:0"><i class="ph-fill ph-linkedin-logo" style="font-size:17px"></i>Continue with LinkedIn</button>
      </div>

      <div style="display:flex;align-items:center;gap:13px;margin-bottom:20px">
        <div style="flex:1;height:1px;background:var(--color-divider)"></div>
        <span class="k">or</span>
        <div style="flex:1;height:1px;background:var(--color-divider)"></div>
      </div>

      <div class="field" style="margin-bottom:12px"><label style="font-size:11.5px">Email</label><div class="input" style="display:flex;align-items:center;font-size:13px">zara@example.com</div></div>
      <div class="field" style="margin-bottom:6px">
        <label style="font-size:11.5px;display:flex;justify-content:space-between;align-items:baseline">Password<a href="signup.html" style="font-size:11px;font-weight:400">Forgot password?</a></label>
        <div class="input" style="display:flex;align-items:center;justify-content:space-between;font-size:13px">••••••••••<i class="ph ph-eye mut" style="font-size:14px"></i></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin:14px 0 20px">
        <span style="width:13px;height:13px;border-radius:3px;background:var(--color-accent);flex:none"></span>
        <span style="font-size:12px">Keep me signed in on this device</span>
      </div>
      <button class="btn btn-primary btn-block" style="justify-content:center;font-size:13.5px;margin-top:0">Log in</button>

      <div style="margin-top:26px;padding-top:20px;border-top:1px solid var(--color-divider)">
        <p style="margin:0;font-size:11.5px;line-height:1.55" class="mut">Recruiters and chapter admins use the same login — your role is on the account, not a separate door.</p>
      </div>
    </div>
  </div>
<script src="../assets/theme.js"></script>
<script src="../assets/nav.js" defer></script>
<script src="../assets/interactions.js" defer></script>
</body>
</html>
